<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mu16TTY</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <div id="app-shell" class="app-shell timeline-list">
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

      <div class="workspace">
        <div class="chat-workspace">
          <nav class="view-switch" aria-label="メッセージ表示形式">
            <button id="timeline-view-list" type="button" aria-pressed="true">リスト</button>
            <button id="timeline-view-messenger" type="button" aria-pressed="false">メッセンジャー</button>
            <button id="monitor-toggle" class="monitor-toggle" type="button" aria-expanded="false" aria-controls="monitor-sidebar">監視</button>
            <strong class="tabbar-brand">Mu16TTY</strong>
          </nav>

          <main class="timeline-panel">
            <div class="list-header" aria-hidden="true">
              <span></span><span>日時</span><span>Sender</span><span>Message</span>
              <span>Source</span><span>品質</span><span>CRC</span><span>Session</span><span>Sequence</span>
            </div>
            <section id="timeline" class="timeline" aria-label="メッセージタイムライン">
              <div id="empty-state" class="empty-state">
                <p class="empty-mark" aria-hidden="true">♪</p>
                <h2>受信待機中</h2>
                <p>CRC確認済み受信に加え、CRC不一致でも構造復号できた候補を damaged として記録します。</p>
              </div>
            </section>
            <button id="new-messages" class="new-messages" type="button" hidden>新しいメッセージ</button>
          </main>

          <section class="message-detail-panel" aria-labelledby="message-detail-heading">
            <div class="panel-resize" data-resize-boundary="1" aria-hidden="true"></div>
            <div class="receive-preview-heading">
              <span id="message-detail-heading">メッセージ詳細</span>
              <button id="message-detail-toggle" type="button" aria-controls="message-detail" aria-expanded="false">開く</button>
            </div>
            <div id="message-detail" class="message-detail" tabindex="0" hidden></div>
          </section>
          <section class="receive-preview" aria-labelledby="receive-preview-heading">
            <div class="panel-resize" data-resize-boundary="2" aria-hidden="true"></div>
            <div class="receive-preview-heading">
              <span id="receive-preview-heading">受信途中</span>
              <button id="receive-preview-toggle" type="button" aria-controls="receive-preview" aria-expanded="false">開く</button>
            </div>
            <div id="receive-preview" class="receive-preview-body" hidden></div>
          </section>

          <footer class="composer-panel">
            <div class="panel-resize" data-resize-boundary="3" aria-hidden="true"></div>
            <form id="composer-form" class="composer-form">
              <div class="composer-heading">
                <label for="message-input">メッセージ</label>
                <p id="composer-status" class="composer-status" aria-live="polite">Ctrl+Enterで送信</p>
              </div>
              <textarea id="message-input" name="message" rows="3" spellcheck="true" aria-describedby="byte-count composer-status"></textarea>
              <div class="composer-controls">
                <fieldset class="mode-switch">
                  <legend>送信モード</legend>
                  <label for="mode-40"><input id="mode-40" type="radio" name="mode" value="40" checked><span>40/s REF</span></label>
                  <label for="mode-20"><input id="mode-20" type="radio" name="mode" value="20"><span>20/s +3dB</span></label>
                  <label for="mode-10"><input id="mode-10" type="radio" name="mode" value="10"><span>10/s +6dB</span></label>
                  <label for="mode-4"><input id="mode-4" type="radio" name="mode" value="4"><span>4/s 240BPM +10dB</span></label>
                </fieldset>
                <output id="byte-count" class="byte-count" for="message-input">0 / 280 bytes</output>
                <button id="send-button" class="send-button" type="submit">送信</button>
              </div>
            </form>
          </footer>
        </div>

        <aside id="monitor-sidebar" class="monitor-sidebar" aria-label="入力監視と局情報">
          <div class="station-summary sidebar-station" aria-label="接続・局状態">
            <span id="connection-status" class="chip chip-muted">接続中</span>
            <span id="service-state" class="chip chip-muted">Service --</span>
            <strong id="callsign" class="callsign">--------</strong>
          </div>
          <header class="monitor-header"><h2>入力モニター</h2><button id="monitor-close" type="button" aria-label="監視パネルを閉じる">閉じる</button></header>
          <div class="monitor-summary"><strong id="monitor-state" class="monitor-status monitor-idle">NO INPUT</strong><span id="monitor-rms">RMS — dBFS</span><span id="monitor-peak">Peak — dBFS</span></div>
          <div class="level-meter" aria-hidden="true"><span id="monitor-level"></span></div>
          <div id="input-queue" class="input-queue" hidden>
            <div class="input-queue-heading"><span>RX QUEUE</span><span id="input-queue-count"></span></div>
            <div class="input-queue-track" aria-hidden="true"><span></span><i></i></div>
          </div>
          <canvas id="monitor-waveform" class="monitor-canvas waveform-canvas" aria-label="入力信号波形"></canvas>
          <div class="waterfall-label"><span>0 Hz</span><span>3 kHz</span></div>
          <canvas id="monitor-waterfall" class="monitor-canvas waterfall-canvas" aria-label="0から3kHzのウォーターフォール"></canvas>
          <section class="decoder-console" aria-labelledby="decoder-console-title">
            <h2 id="decoder-console-title">デコーダ状態</h2>
            <div id="decoder-status-list" class="decoder-status-list" aria-live="polite"></div>
            <label class="decoder-log-label" for="decoder-log">状態ログ</label>
            <textarea id="decoder-log" class="decoder-log" readonly spellcheck="false" aria-label="デコーダ状態ログ"></textarea>
          </section>
          <details id="station-details" class="station-details" open>
            <summary>局・デバイス情報</summary>
            <div class="health-row" aria-label="モデム状態"><span id="rx-state" class="chip chip-muted">RX --</span><span id="tx-state" class="chip chip-muted">TX --</span><span id="ptt-state" class="chip chip-muted" hidden></span><button id="settings-button" class="settings-button" type="button">設定</button></div>
            <dl id="detail-list" class="detail-list"></dl>
          </details>
        </aside>
        <button id="monitor-backdrop" class="monitor-backdrop" type="button" aria-label="監視パネルを閉じる" hidden></button>
      </div>
    </div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
